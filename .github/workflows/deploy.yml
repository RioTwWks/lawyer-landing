name: Build and Deploy to Selectel S3

on:
  push:
    branches:
      - main # Пайплайн запускается автоматически при пуше в main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Шаг 1: Клонируем ваш код на сервер сборки GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # Шаг 2: Разворачиваем среду Node.js актуальной 24-й версии
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    # Шаг 3: Устанавливаем зависимости (Vite, Tailwind и т.д.) из вашего package.json
    - name: Install dependencies
      run: npm ci

    # Шаг 4: Запускаем сборку проекта. Именно эта команда создает магическую папку ./dist
    - name: Build project
      run: npm run build

    # Шаг 5: Берем готовую папку ./dist и синхронизируем её с бакетом Selectel
    - name: Deploy folder to Selectel S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.SELECTEL_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SELECTEL_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ru-7
      run: |
        # Если папка dist существует — деплоим её, если нет — деплоим корень проекта (.)
        TARGET_DIR="./dist"
        if [ ! -d "$TARGET_DIR" ]; then
          TARGET_DIR="."
        fi
        
        aws s3 sync $TARGET_DIR s3://${{ secrets.SELECTEL_BUCKET_NAME }} \
          --endpoint-url=https://s3.ru-7.storage.selcloud.ru \
          --exclude ".git*" \
          --exclude ".github*" \
          --exclude "node_modules*" \
          --delete
